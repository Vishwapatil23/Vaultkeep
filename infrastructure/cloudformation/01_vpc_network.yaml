AWSTemplateFormatVersion: '2010-09-09'
Description: 'VaultKeep Infrastructure: Custom VPC, Public/Private Subnets, and Least-Privilege Security Groups'

Parameters:
  VpcCIDR:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for VaultKeep VPC
  PublicSubnet1CIDR:
    Type: String
    Default: '10.0.1.0/24'
  PublicSubnet2CIDR:
    Type: String
    Default: '10.0.2.0/24'
  PrivateAppSubnet1CIDR:
    Type: String
    Default: '10.0.11.0/24'
  PrivateAppSubnet2CIDR:
    Type: String
    Default: '10.0.12.0/24'
  PrivateDBSubnet1CIDR:
    Type: String
    Default: '10.0.21.0/24'
  PrivateDBSubnet2CIDR:
    Type: String
    Default: '10.0.22.0/24'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VaultKeep-VPC
        - Key: Project
          Value: VaultKeep

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VaultKeep-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VaultKeep-Public-Subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VaultKeep-Public-Subnet-2

  PrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateAppSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VaultKeep-Private-App-Subnet-1

  PrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateAppSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VaultKeep-Private-App-Subnet-2

  PrivateDBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateDBSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VaultKeep-Private-DB-Subnet-1

  PrivateDBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateDBSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VaultKeep-Private-DB-Subnet-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: VaultKeep-Public-Route-Table

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow inbound HTTP/HTTPS traffic to ALB'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: VaultKeep-ALB-SG

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow inbound traffic to backend instances from ALB only'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: VaultKeep-App-SG

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow PostgreSQL traffic from backend application security group only'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: VaultKeep-RDS-SG

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: VaultKeep-VpcId
  PublicSubnet1:
    Value: !Ref PublicSubnet1
    Export:
      Name: VaultKeep-PublicSubnet1
  PublicSubnet2:
    Value: !Ref PublicSubnet2
    Export:
      Name: VaultKeep-PublicSubnet2
  PrivateAppSubnet1:
    Value: !Ref PrivateAppSubnet1
    Export:
      Name: VaultKeep-PrivateAppSubnet1
  PrivateAppSubnet2:
    Value: !Ref PrivateAppSubnet2
    Export:
      Name: VaultKeep-PrivateAppSubnet2
  PrivateDBSubnet1:
    Value: !Ref PrivateDBSubnet1
    Export:
      Name: VaultKeep-PrivateDBSubnet1
  PrivateDBSubnet2:
    Value: !Ref PrivateDBSubnet2
    Export:
      Name: VaultKeep-PrivateDBSubnet2
  ALBSGId:
    Value: !Ref ALBSecurityGroup
    Export:
      Name: VaultKeep-ALBSGId
  AppSGId:
    Value: !Ref AppSecurityGroup
    Export:
      Name: VaultKeep-AppSGId
  DBSGId:
    Value: !Ref DBSecurityGroup
    Export:
      Name: VaultKeep-DBSGId
