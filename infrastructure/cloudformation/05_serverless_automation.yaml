AWSTemplateFormatVersion: '2010-09-09'
Description: 'VaultKeep Automation & Observability: EventBridge Rule, Lambda Inactivity Engine, SNS Topics, and CloudWatch Alarms'

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: Name of the S3 bucket containing the Lambda deployment package (leave blank to use the VaultKeep S3 bucket)
    Default: ''
  LambdaCodeKey:
    Type: String
    Description: S3 object key of the inactivity worker Lambda deployment zip package
    Default: 'lambda/inactivity_worker.zip'

Conditions:
  UseCustomBucket: !Not [!Equals [!Ref LambdaCodeBucket, '']]

Resources:
  # 1. Amazon SNS Topics
  InactivityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: vaultkeep-inactivity-alerts
      DisplayName: 'VaultKeep Inactivity Security Alerts'
      Tags:
        - Key: Project
          Value: VaultKeep

  AccessGrantedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: vaultkeep-access-granted
      DisplayName: 'VaultKeep Legacy Document Access Granted'
      Tags:
        - Key: Project
          Value: VaultKeep

  # 2. Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultKeep-Lambda-InactivityWorker-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: VaultKeepSNSPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource:
                  - !Ref InactivityAlertsTopic
                  - !Ref AccessGrantedTopic
        - PolicyName: VaultKeepSSMParameterAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vaultkeep/*'
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                Resource: '*'

  # 3. AWS Lambda Function
  InactivityWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vaultkeep-inactivity-monitor
      Runtime: nodejs20.x
      Handler: inactivity_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SNS_INACTIVITY_TOPIC_ARN: !Ref InactivityAlertsTopic
          SNS_ACCESS_GRANTED_TOPIC_ARN: !Ref AccessGrantedTopic
          DB_HOST:
            Fn::ImportValue: VaultKeep-DBEndpoint
          DB_NAME: vaultkeep_db
          DB_USER: vaultkeep_admin
          DB_PASSWORD_PARAM: /vaultkeep/prod/db_password
          DB_SSL: 'true'
          DB_CA_PATH: 'rds-ca-bundle.pem'
      Code:
        S3Bucket:
          !If
            - UseCustomBucket
            - !Ref LambdaCodeBucket
            - Fn::ImportValue: VaultKeep-S3BucketName
        S3Key: !Ref LambdaCodeKey
      Tags:
        - Key: Project
          Value: VaultKeep

  # 4. Amazon EventBridge Scheduled Rule
  DailyInactivityScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: vaultkeep-daily-inactivity-audit
      Description: 'Scheduled cloud trigger executing VaultKeep inactivity evaluation workflow'
      ScheduleExpression: 'rate(1 day)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt InactivityWorkerFunction.Arn
          Id: VaultKeepInactivityWorkerTarget

  PermissionForEventBridgeToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InactivityWorkerFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyInactivityScheduleRule.Arn

  # 5. Amazon CloudWatch Alarm (Failed Decryption Attempts)
  FailedDecryptionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: VaultKeep-FailedDecryption-SecurityAlarm
      AlarmDescription: 'Triggers when 3 or more failed cryptographic decryption attempts occur within 5 minutes, signaling possible tampering.'
      MetricName: FailedDecryptionAttempts
      Namespace: VaultKeep/Application
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref InactivityAlertsTopic
      TreatMissingData: notBreaching

Outputs:
  InactivityTopicArn:
    Value: !Ref InactivityAlertsTopic
    Export:
      Name: VaultKeep-InactivityTopicArn
  AccessGrantedTopicArn:
    Value: !Ref AccessGrantedTopic
    Export:
      Name: VaultKeep-AccessGrantedTopicArn
  LambdaFunctionArn:
    Value: !GetAtt InactivityWorkerFunction.Arn
